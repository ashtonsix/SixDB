<text x="32" y="854" font-size="21" font-weight="normal" fill="#586579" text-anchor="start">* Read only values requested by the law; this example requests after-values only.</text>
<text x="32" y="886" font-size="21" font-weight="normal" fill="#586579" text-anchor="start">The owner supplies isolation. Whole-call admission does not create a range snapshot.</text>
