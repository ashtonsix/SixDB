<rect x="352" y="204" width="256" height="64" rx="0" fill="#a9e8a2" stroke="white" stroke-width="1.5"/>
<text x="480" y="242" font-size="23" font-weight="bold" fill="#233047" text-anchor="middle">C · unchanged</text>
<path d="M272,268 V290 H368" fill="none" stroke="#586579" stroke-width="1.8"/>
<text x="376" y="297" font-size="19" font-weight="normal" fill="#586579" text-anchor="start">a = retired A, bit 0</text>
