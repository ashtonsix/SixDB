<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title description">
<title id="title">TuplePack: mutation destinations, issued bytes and observation dependencies</title>
<desc id="description">After substitution in composition.cpp, B remains in original byte zero bits one through seven, sharing the byte with retired A at bit zero. C remains in original byte one. New A occupies bit three of new-source byte two. Mutation writes new A and B; issued stores cover new byte two and original byte zero, preserving neighbors; the summary observes new A, B and untouched C. A range admits the whole call, then repeats optional before-values, all child stores, optional after-values and law per nonempty window.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
