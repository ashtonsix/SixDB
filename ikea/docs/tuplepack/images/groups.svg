<rect x="336" y="512" width="152" height="56" rx="0" fill="#98c9f3" stroke="white" stroke-width="1.5"/>
<text x="412" y="548" font-size="24" font-weight="normal" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A1</text>
<text x="564" y="496" font-size="18" font-weight="normal" fill="#586579" text-anchor="middle">3</text>
<rect x="488" y="512" width="152" height="56" rx="0" fill="#ffdb79" stroke="white" stroke-width="1.5"/>
