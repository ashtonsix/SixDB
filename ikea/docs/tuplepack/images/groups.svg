<path d="M32,304 V320 H1248 V304" fill="none" stroke="#586579" stroke-width="1.8"/>
<text x="640" y="352" font-size="21" font-weight="normal" fill="#586579" text-anchor="middle">One group · A/B/C/D for each row</text>
<text x="32" y="416" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">Groups {2, 1, 1}: A/B together, C and D separately</text>
<text x="32" y="456" font-size="21" font-weight="normal" fill="#233047" text-anchor="start">Repeat A/B for both rows, then C for both rows, then D.</text>
