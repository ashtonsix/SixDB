<rect x="792" y="512" width="152" height="56" rx="0" fill="#a9e8a2" stroke="white" stroke-width="1.5"/>
<text x="868" y="548" font-size="24" font-weight="normal" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C1</text>
<text x="1020" y="496" font-size="18" font-weight="normal" fill="#586579" text-anchor="middle">6</text>
