<path d="M32,576 V592 H640 V576" fill="none" stroke="#586579" stroke-width="1.8"/>
<text x="336" y="624" font-size="21" font-weight="normal" fill="#586579" text-anchor="middle">A/B group · 4 bytes</text>
<path d="M640,576 V592 H944 V576" fill="none" stroke="#586579" stroke-width="1.8"/>
<text x="792" y="624" font-size="21" font-weight="normal" fill="#586579" text-anchor="middle">C group · 2 bytes</text>
<path d="M944,576 V592 H1248 V576" fill="none" stroke="#586579" stroke-width="1.8"/>
<text x="1096" y="624" font-size="21" font-weight="normal" fill="#586579" text-anchor="middle">D group · 2 bytes</text>
<text x="32" y="680" font-size="21" font-weight="normal" fill="#586579" text-anchor="start">Each cell is one byte. Both orders fill one 8-byte packet: two rows × four slots.</text>
</g></svg>
