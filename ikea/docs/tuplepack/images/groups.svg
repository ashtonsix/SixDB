<text x="1020" y="548" font-size="24" font-weight="normal" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">D0</text>
<text x="1172" y="496" font-size="18" font-weight="normal" fill="#586579" text-anchor="middle">7</text>
<rect x="1096" y="512" width="152" height="56" rx="0" fill="#c7b9f3" stroke="white" stroke-width="1.5"/>
