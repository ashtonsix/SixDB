<text x="868" y="276" font-size="24" font-weight="normal" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">B1</text>
<text x="1020" y="224" font-size="18" font-weight="normal" fill="#586579" text-anchor="middle">6</text>
<rect x="944" y="240" width="152" height="56" rx="0" fill="#a9e8a2" stroke="white" stroke-width="1.5"/>
<text x="1020" y="276" font-size="24" font-weight="normal" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C1</text>
<text x="1172" y="224" font-size="18" font-weight="normal" fill="#586579" text-anchor="middle">7</text>
<rect x="1096" y="240" width="152" height="56" rx="0" fill="#c7b9f3" stroke="white" stroke-width="1.5"/>
