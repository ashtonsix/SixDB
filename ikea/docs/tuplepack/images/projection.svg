<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">TuplePack: physical codes, placement and a two-row projection</title>
<desc id="description">Each two-byte unit has a flag in byte zero bit zero, a seven-bit rank in bits one through seven, and a three-bit tag in byte one. Original rows zero and one are at storage offsets two and ten, with bytes 4b 05 and 18 02. Repeating map 1, hole, 0, 2 yields decoded slots 25 00 01 05, then 0c 00 00 02 in a uint64 packet.</desc>
