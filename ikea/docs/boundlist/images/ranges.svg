<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="744" viewBox="0 0 1280 744" role="img" aria-labelledby="title description">
<title id="title">Occupied key bounds can have gaps between children</title>
<desc id="description">The spans show smallest and largest stored keys, not keyspace partition boundaries. Contiguous partitions can contain unused keys. Closed occupied bounds at ranks 0 through 5 are 3..7,10..10,18..24,26..31,35..40,46..52. Rank 2 is ineligible. Query 9 inclusive to 36 exclusive returns candidate ranks 1 through 4. Translucent green query points cross amber candidate rows; the consumer skips the internal ineligible rank. Rank 1 is a populated singleton.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
<rect width="1280" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#233047" font-size="21">
<text x="32" y="42" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">Occupied key bounds can have gaps between children</text>
<text x="32" y="78" font-size="20" font-weight="normal" fill="#586579" text-anchor="start">Blue spans show stored-key minima and maxima. Partition boundaries are not drawn.</text>
<text x="50" y="126" font-size="20" font-weight="bold" fill="#233047" text-anchor="start">Key</text>
