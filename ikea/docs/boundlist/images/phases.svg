<text x="337" y="222" font-size="17" font-weight="normal" fill="#233047" text-anchor="middle">search checkpoints</text>
<rect x="488" y="146" width="285" height="124" rx="6" fill="#f1f4f8" stroke="#d9e0e9" stroke-width="1.5"/>
<text x="630.5" y="176" font-size="19" font-weight="bold" fill="#233047" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">local_window</text>
<rect x="527" y="195" width="12" height="28" rx="0" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
