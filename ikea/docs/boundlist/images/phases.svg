<text x="320" y="567" font-size="20" font-weight="normal" fill="#233047" text-anchor="start">boundaries + eligibility + backing + derived search state</text>
<text x="32" y="625" font-size="20" font-weight="normal" fill="#586579" text-anchor="start">Hint windows are not read grants; selection and bracket repair can read elsewhere.</text>
