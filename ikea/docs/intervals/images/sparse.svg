<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
<title id="title">Checkpoint spacing differs from native read width</title>
<desc id="description">Both rows contain 64 size fields in four native 16-field windows. G16 stores region checkpoints at ranks 0,16,32,48; G64 stores one at rank 0. The start of rank 47 uses checkpoint 32 plus 15 fields at G16, or checkpoint 0 plus 16 plus 16 plus 15 fields at G64. Larger spacing saves checkpoint bytes and writes but needs more prefix work. The independent G64 option can read all four admitted native windows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
<rect width="1280" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#233047" font-size="21">
<text x="32" y="42" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">Checkpoint spacing differs from native read width</text>
<text x="32" y="80" font-size="20" font-weight="normal" fill="#586579" text-anchor="start">Same 64 sizes. Four native windows of 16 fields; the owner chooses checkpoint spacing.</text>
<text x="32" y="192" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">G16</text>
<rect x="210" y="170" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="323" y="195" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 0..15</text>
<text x="323" y="219" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="210" y="123" width="226" height="32" rx="4" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
<text x="323" y="146" font-size="18" font-weight="normal" fill="#233047" text-anchor="middle">checkpoint at 0</text>
<rect x="460" y="170" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="573" y="195" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 16..31</text>
<text x="573" y="219" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="460" y="123" width="226" height="32" rx="4" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
<text x="573" y="146" font-size="18" font-weight="normal" fill="#233047" text-anchor="middle">checkpoint at 16</text>
<rect x="710" y="170" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="823" y="195" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 32..47</text>
<text x="823" y="219" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="710" y="123" width="226" height="32" rx="4" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
<text x="823" y="146" font-size="18" font-weight="normal" fill="#233047" text-anchor="middle">checkpoint at 32</text>
<rect x="960" y="170" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="1073" y="195" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 48..63</text>
<text x="1073" y="219" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="960" y="123" width="226" height="32" rx="4" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
<text x="1073" y="146" font-size="18" font-weight="normal" fill="#233047" text-anchor="middle">checkpoint at 48</text>
<text x="210" y="266" font-size="20" font-weight="normal" fill="#233047" text-anchor="start">start(47) = C[2] + prefix of 15 fields</text>
<text x="32" y="360" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">G64</text>
<rect x="210" y="338" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="323" y="363" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 0..15</text>
<text x="323" y="387" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="210" y="291" width="226" height="32" rx="4" fill="#e1effc" stroke="#8dbce7" stroke-width="1.5"/>
<text x="323" y="314" font-size="18" font-weight="normal" fill="#233047" text-anchor="middle">checkpoint at 0</text>
<rect x="460" y="338" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="573" y="363" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 16..31</text>
<text x="573" y="387" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="710" y="338" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="823" y="363" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 32..47</text>
<text x="823" y="387" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<rect x="960" y="338" width="226" height="62" rx="5" fill="#e5f3df" stroke="#a5cd9c" stroke-width="1.5"/>
<text x="1073" y="363" font-size="20" font-weight="normal" fill="#233047" text-anchor="middle">ranks 48..63</text>
<text x="1073" y="387" font-size="17" font-weight="normal" fill="#586579" text-anchor="middle">16 readable fields</text>
<text x="210" y="434" font-size="20" font-weight="normal" fill="#233047" text-anchor="start">start(47) = C[0] + 16 fields + 16 fields + 15 fields</text>
<path d="M32,474 L1248,474" fill="none" stroke="#d9e0e9" stroke-width="2"/>
<text x="32" y="510" font-size="20" font-weight="normal" fill="#586579" text-anchor="start">Fewer checkpoints save bytes and writes; point reads can need more local work.</text>
<text x="32" y="541" font-size="20" font-weight="normal" fill="#586579" text-anchor="start">G64 independent execution may read all four admitted windows. It is a workload choice.</text>
</g></svg>
