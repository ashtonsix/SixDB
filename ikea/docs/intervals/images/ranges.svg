<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="744" viewBox="0 0 1280 744" role="img" aria-labelledby="title description">
<title id="title">Consecutive cuts define contiguous intervals</title>
<desc id="description">Cuts 0,8,18,26,35,46,56 define six adjacent half-open intervals. Each rank ends exactly where the next starts. Rank 2 is excluded but retains its interval 18 inclusive to 26 exclusive. Query 9 inclusive to 36 exclusive overlaps ranks 1 through 4, giving rank window 1 inclusive to 5 exclusive. Selected traversal skips rank 2. The green query overlay crosses amber result rows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
