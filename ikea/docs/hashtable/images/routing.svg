<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="404" viewBox="0 0 1280 404" role="img" aria-labelledby="title description">
<title id="title">The bucket address carries part of the key</title>
<desc id="description">A reversible permutation maps a 16-bit key to 0xa35a. Its high four bits, 1010, select bucket ten. Its low twelve bits, 0011 0101 1010, are stored as quotient 0x35a. The bucket and quotient reconstruct the complete permuted key, which the inverse permutation recovers using the same seed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
<rect width="1280" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#233047" font-size="21">
<text x="32" y="42" font-size="26" font-weight="bold" fill="#233047" text-anchor="start">The bucket address carries part of the key</text>
<text x="32" y="80" font-size="22" font-weight="normal" fill="#586579" text-anchor="start">Worked example · W = 16 · b = 4 · K = 12 · seed = 713</text>
<text x="32" y="154" font-size="22" font-weight="normal" fill="#233047" text-anchor="start">Key 0x149f</text>
<text x="32" y="186" font-size="22" font-weight="normal" fill="#233047" text-anchor="start">reversibly permuted</text>
