<path d="M145,208 V256 H282 V292" fill="none" stroke="#586579" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M753,208 V256 H916 V292" fill="none" stroke="#586579" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="300" width="500" height="116" rx="3" fill="#f0f3f7" stroke="white" stroke-width="1.5"/>
<text x="282" y="344" font-size="23" font-weight="bold" fill="#233047" text-anchor="middle">Lane 1 · same tag, different full key</text>
<text x="282" y="382" font-size="22" font-weight="normal" fill="#233047" text-anchor="middle">Reject; check the next candidate</text>
<rect x="584" y="300" width="664" height="116" rx="3" fill="#a9e8a2" stroke="white" stroke-width="1.5"/>
<text x="916" y="344" font-size="23" font-weight="bold" fill="#233047" text-anchor="middle">Lane 9 · same tag, matching full key</text>
<text x="916" y="382" font-size="22" font-weight="normal" fill="#233047" text-anchor="middle">Hit; return the stored value for a map</text>
<text x="32" y="454" font-size="22" font-weight="normal" fill="#586579" text-anchor="start">00 = empty</text>
<text x="256" y="454" font-size="22" font-weight="normal" fill="#586579" text-anchor="start">01 = tombstone</text>
<text x="544" y="454" font-size="22" font-weight="normal" fill="#586579" text-anchor="start">02–FF = occupied tag</text>
<path d="M32,474 H1248" fill="none" stroke="#d9e0e9" stroke-width="1.8"/>
<text x="32" y="512" font-size="22" font-weight="normal" fill="#233047" text-anchor="start">The empty at lane 3 does not cancel the candidate at lane 9.</text>
<text x="32" y="548" font-size="22" font-weight="normal" fill="#586579" text-anchor="start">No full-key hit: any empty → miss; otherwise probe the next group.</text>
</g></svg>
