<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="568" viewBox="0 0 1280 568" role="img" aria-labelledby="title description">
<title id="title">Check a Swiss group&#x27;s candidates before empty termination</title>
<desc id="description">An illustrative sixteen-byte control group has matching tags A6 at lanes one and nine, empty controls at lanes three and fifteen, and a tombstone at lane two. Lane one&#x27;s full key differs and is rejected; lane nine&#x27;s full key matches. The earlier empty does not suppress the later candidate. Only after all candidate keys fail can any empty terminate the group search with a miss.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#586579"/></marker></defs>
