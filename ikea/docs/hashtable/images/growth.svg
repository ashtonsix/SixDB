<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="624" viewBox="0 0 1280 624" role="img" aria-labelledby="title description">
<title id="title">Same-seed growth preserves row positions in compatible layouts</title>
<desc id="description">The displayed parent tile has live rows zero, one, three, five and six. Their top quotient bits are zero, one, zero, one and zero. Child 2i keeps rows zero, three and six; child 2i plus one keeps rows one and five. The top quotient bit moves into the bucket address. Other rows become empty; live values keep their row positions. The actual split is checked against grow.</desc>
