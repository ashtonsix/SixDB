<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="772" viewBox="0 0 1280 772" role="img" aria-labelledby="title description">
<title id="title">Bec256 encodes position 29 as body byte a7</title>
<desc id="description">With population one, divide regions zero to 255, zero to 127, zero to 63, zero to 31, then 16 to 31. Their left and right counts are respectively one and zero, one and zero, one and zero, zero and one, zero and one. The stored left counts are one, one, one, zero, zero, locating byte three. The eight one-bit byte values are 01, 02, 04, 08, 10, 20, 40 and 80. Rank five selects 20. Its bits one, zero, one follow the five split bits, giving a7 in least-significant-bit-first stream order.</desc>
