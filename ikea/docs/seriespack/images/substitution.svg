<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="624" viewBox="0 0 1280 624" role="img" aria-labelledby="title description">
<title id="title">Substitute a nested child while preserving the parent contract</title>
<desc id="description">A 12-bit value keeps its eight-bit head from the parent source while its four-bit residual is replaced by a complete child expression backed by Striped64. The parent head still tiles eight rows at a time. The retired residual is not used by reads, writes or effects.</desc>
